# Compliance and informatics stack. Required secrets come from .env (never commit .env).
#
# Known debt (NFR-SEC-001, Gateway R2 OPEN): this stack does not enforce client-certificate TLS
# to the compliance database. The postgres service has no TLS listener and no pg_hba hostssl
# clientcert=verify-full rule. DB_SSLMODE therefore defaults to "disable" here. Production
# deployments must not use this default. See docs/migration-map.md.
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-surgitwin}
      POSTGRES_USER: ${POSTGRES_USER:-surgitwin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      # Loopback only. The qualification tests on the host connect here (BIOSYNC_TEST_DATABASE_URL).
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Init source: the append-only schema, applied in order on first start. The nightly
      # hash-chain-check.sql is a read-only report and is not mounted here.
      - ./database/migrations/001-extensions.sql:/docker-entrypoint-initdb.d/001-extensions.sql:ro
      - ./database/migrations/002-schema.sql:/docker-entrypoint-initdb.d/002-schema.sql:ro
      - ./database/migrations/003-triggers.sql:/docker-entrypoint-initdb.d/003-triggers.sql:ro

  middleware:
    build:
      context: ./middleware
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-surgitwin}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-surgitwin}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    ports:
      - "8000:8000"

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app:ro
    command: ["sh", "-c", "echo frontend placeholder; sleep infinity"]

volumes:
  pgdata:
