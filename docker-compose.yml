# Compliance and informatics stack. Required secrets come from .env (never commit .env).
#
# TLS (NFR-SEC-001, Gateway R2 closed): the postgres service accepts only TLS connections that
# present a client certificate (database/postgres/pg_hba.conf, hostssl clientcert=verify-full).
# The middleware connects with DB_SSLMODE=verify-full. Certificates are generated by
# database/certs/generate-certs.sh into database/certs/out/ before the first "docker compose up".
# See docs/db-client-cert-tls.md.
services:
  postgres:
    image: postgres:15
    entrypoint: ["sh", "/opt/biosync/postgres-entrypoint.sh"]
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/tls/server.key
      - -c
      - ssl_ca_file=/var/lib/postgresql/tls/ca.crt
      - -c
      - hba_file=/opt/biosync/pg_hba.conf
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-surgitwin}
      POSTGRES_USER: ${POSTGRES_USER:-surgitwin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      # Loopback only. The qualification tests on the host connect here (BIOSYNC_TEST_DATABASE_URL).
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Init source: the append-only schema, applied on first start. The entrypoint runs the mount
      # targets in lexical order, so the target names set the apply order to 001, 002, 003, 004,
      # 006, 005. The source names of 005 and 006 are swapped in the targets on purpose: 005 grants
      # on telemetry_sessions, which 006 creates, and plain lexical order of the source names would
      # run 005 first. The nightly hash-chain-check.sql is a read-only report and is not mounted.
      - ./database/migrations/001-extensions.sql:/docker-entrypoint-initdb.d/001-extensions.sql:ro
      - ./database/migrations/002-schema.sql:/docker-entrypoint-initdb.d/002-schema.sql:ro
      - ./database/migrations/003-triggers.sql:/docker-entrypoint-initdb.d/003-triggers.sql:ro
      - ./database/migrations/004-audit-capture.sql:/docker-entrypoint-initdb.d/004-audit-capture.sql:ro
      - ./database/migrations/006-telemetry-sessions.sql:/docker-entrypoint-initdb.d/005-telemetry-sessions.sql:ro
      - ./database/migrations/005-roles.sql:/docker-entrypoint-initdb.d/006-roles.sql:ro
      # TLS material. The CA private key (ca.key) is never mounted into a container.
      - ./database/certs/postgres-entrypoint.sh:/opt/biosync/postgres-entrypoint.sh:ro
      - ./database/postgres/pg_hba.conf:/opt/biosync/pg_hba.conf:ro
      - ./database/certs/out/server.crt:/etc/biosync/tls-src/server.crt:ro
      - ./database/certs/out/server.key:/etc/biosync/tls-src/server.key:ro
      - ./database/certs/out/ca.crt:/etc/biosync/tls-src/ca.crt:ro

  middleware:
    build:
      context: ./middleware
    depends_on:
      - postgres
    entrypoint: ["sh", "/opt/biosync/middleware-entrypoint.sh"]
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-surgitwin}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-surgitwin}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # Fixed by the shipped stack. The server certificate must verify against ca.crt and carry
      # the host name "postgres". Lowering this mode requires editing this file on purpose.
      DB_SSLMODE: verify-full
      DB_SSLROOTCERT: /etc/biosync/db-tls/ca.crt
      DB_SSLCERT: /etc/biosync/db-tls/client.crt
      DB_SSLKEY: /tmp/biosync-db-tls/client.key
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    volumes:
      - ./database/certs/middleware-entrypoint.sh:/opt/biosync/middleware-entrypoint.sh:ro
      - ./database/certs/out/ca.crt:/etc/biosync/db-tls/ca.crt:ro
      - ./database/certs/out/client.crt:/etc/biosync/db-tls/client.crt:ro
      - ./database/certs/out/client.key:/etc/biosync/db-tls/client.key:ro
    ports:
      - "8000:8000"

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app:ro
    command: ["sh", "-c", "echo frontend placeholder; sleep infinity"]

volumes:
  pgdata:
