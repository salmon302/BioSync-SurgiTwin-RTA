# PostgreSQL client authentication for the SurgiTwin-RTA database (SRS NFR-SEC-001, Gateway R2).
# Origin: BioSync-Gateway database/pg_hba.conf (adapted).
#
# Network connections must use TLS (hostssl) and present a client certificate that chains to
# ssl_ca_file. clientcert=verify-full also requires the certificate CN to equal the role name.
# The role password is still required (scram-sha-256). There is no host row (plaintext TCP), so
# a non-TLS network connection matches no entry and is rejected.
#
# The local row is trust for in-container administration over the Unix socket, such as
# docker exec ... psql for migrations and test database creation. Network clients cannot reach
# the socket.
#
# TYPE     DATABASE  USER  ADDRESS       METHOD
local      all       all                  trust
hostssl    all       all   0.0.0.0/0      scram-sha-256  clientcert=verify-full
hostssl    all       all   ::/0           scram-sha-256  clientcert=verify-full
