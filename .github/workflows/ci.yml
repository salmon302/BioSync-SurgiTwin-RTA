name: ci

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r middleware/requirements-test.txt
      - run: python -m pytest middleware/tests vv/tests -q

  sim-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r middleware/requirements-test.txt
      # Blocking gate. Rule set and suppressions are in sim/pyproject.toml.
      - run: python -m ruff check sim
      # Advisory style report. Findings here do not fail the job.
      - run: python -m ruff check sim --select E,W,UP,I,BLE --exit-zero --statistics
      - run: python -m mypy --config-file sim/pyproject.toml sim/sofa/src sim/bridge/tools sim/segmentation

  qualification:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: surgitwin_test
          POSTGRES_USER: surgitwin_test
          # Ephemeral password for this CI service container only. It is not a deployment secret.
          POSTGRES_PASSWORD: ci-ephemeral-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U surgitwin_test -d surgitwin_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BIOSYNC_TEST_DATABASE_URL: postgresql+psycopg2://surgitwin_test:ci-ephemeral-password@localhost:5432/surgitwin_test
      BIOSYNC_RELAY_ADMIN_URL: postgresql+psycopg2://surgitwin_test:ci-ephemeral-password@localhost:5432/surgitwin_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r middleware/requirements-test.txt
      # IQ-3, IQ-6, IQ-7, and the DB-backed OQ-7/8/9 and FR-DAT-005 cross-check run here.
      # pgcrypto is created by database/migrations/001-extensions.sql when the fixtures apply it.
      # BIOSYNC_RELAY_ADMIN_URL enables the relay PostgreSQL integration tests (migration 006).
      # PQ-3 (1,000,000 rows) is not run in CI. It needs BIOSYNC_PQ3_DATABASE_URL on a dedicated database.
      - run: python -m pytest middleware/tests vv/tests -q

  cpp-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  # Blocking gate (task 3.7). Exact tool versions and hashes come from
  # vv/static-analysis/pins.json; no floating installs. The runner exits nonzero
  # when findings exceed the accepted set in pins.json.
  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache the pinned clang-tidy 19.1.5
        uses: actions/cache@v4
        with:
          path: ~/llvm-19.1.5
          key: llvm-19.1.5-linux-x64-13e9975b
      - name: Install pinned clang-tidy 19.1.5
        run: |
          set -euo pipefail
          tidy="$(find "$HOME/llvm-19.1.5" -maxdepth 4 -type f -name clang-tidy 2>/dev/null | head -n 1 || true)"
          if [ -z "$tidy" ]; then
            curl -L --fail -o /tmp/llvm-19.1.5.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.5/LLVM-19.1.5-Linux-X64.tar.xz"
            echo "13e9975b026d431c945927960e5f8c0a47a155a2f605f75e85f4d1482620c65f  /tmp/llvm-19.1.5.tar.xz" | sha256sum -c -
            mkdir -p "$HOME/llvm-19.1.5"
            tar -xJf /tmp/llvm-19.1.5.tar.xz -C "$HOME/llvm-19.1.5"
            tidy="$(find "$HOME/llvm-19.1.5" -maxdepth 4 -type f -name clang-tidy | head -n 1)"
          fi
          echo "CLANG_TIDY_EXE=$tidy" >> "$GITHUB_ENV"
      - name: Build pinned cppcheck 2.22.0
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 2.22.0 https://github.com/danmar/cppcheck.git "$RUNNER_TEMP/cppcheck-src"
          test "$(git -C "$RUNNER_TEMP/cppcheck-src" rev-parse HEAD)" = "a436ca35ed1887bee789765122b65ed2d7a7e045"
          make -C "$RUNNER_TEMP/cppcheck-src" -j"$(nproc)"
          echo "CPPCHECK_EXE=$RUNNER_TEMP/cppcheck-src/cppcheck" >> "$GITHUB_ENV"
      - name: Run the pinned check set on rta/
        run: pwsh -File vv/static-analysis/run.ps1
      - name: Upload the static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-rta
          path: SNDEV/logs/static-analysis-baseline-2026-11-12/

  # Task 3.8 slice 1: rta Catch2 and CTest suite on the CI lane. Coverage evidence is
  # produced by the pinned host lane (rta/tests/coverage.ps1, clang 19.1.5 plus gcovr 8.8);
  # this job runs the same suite with the image toolchain.
  rta-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build-rta -DSRTA_BUILD_RTA_TESTS=ON
      - run: cmake --build build-rta
      - run: ctest --test-dir build-rta --output-on-failure
